    /* A tábla alapméretezése és középre igazítása */
    table#sakktabla {
        width: 40vw;

        max-width: 600px;
        max-height: 600px;
        min-width: 300px;
        min-height: 300px;
        border: 4px solid #2c2c2c;
        margin: 40px auto;
        box-shadow: 0 15px 25px rgba(0,0,0,0.3);
    }

    /* A cellák alapértelmezett beállításai (világos mezők) */
    table#sakktabla td {
        width: 12.5%; 
        height: 12.5%;
        background-color: #f0d9b5; /* Klasszikus sakk-tábla világos szín */
        transition: background-color 0.2s ease, box-shadow 0.2s ease;
    }

    /* 
       Sötét mezők kiszámítása az nth-child segítségével 
       1. Páratlan sorok (1, 3, 5, 7) páros cellái (2, 4, 6, 8) SÖTÉTEK
    */
    table#sakktabla tr:nth-child(odd) td:nth-child(even) {
        background-color: #b58863;
    }

    /* 
       2. Páros sorok (2, 4, 6, 8) páratlan cellái (1, 3, 5, 7) SÖTÉTEK
    */
    table#sakktabla tr:nth-child(even) td:nth-child(odd) {
        background-color: #b58863;
    }

    /* Pluszpont: Hover effekt (kijelölés) */
    table#sakktabla td:hover {
        background-color: #799a5e !important; /* Zöldes árnyalat fókuszáláskor */
        cursor: pointer;
        box-shadow: inset 0 0 10px rgba(0,0,0,0.6);
    }
</style>
